; Waveshare ESP32-S3-Touch-LCD-1.28 — Super Mini radar features
; Hardware/flash layout matches theprintablewatch stock (that boots on this board).
; Do not add 16MB partitions or PSRAM flags; those caused the SHA-256 boot loop.

[env:supermini]
platform = espressif32@6.5.0
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200
extra_scripts = post:scripts/merge_firmware.py

; Anti-aliased VLW font (Noto Sans Bold 15, from TFT_eSPI smooth-font examples)
board_build.embed_files = data/ui_font.vlw

; Same USB flags as the working stock firmware.
build_flags =
  -std=gnu++17
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DWM_NODEBUG
  -DWM_MDNS

lib_deps =
  lovyan03/LovyanGFX@^1.2.7
  tzapu/WiFiManager@^2.0.17
  bblanchon/ArduinoJson@^7.4.2
